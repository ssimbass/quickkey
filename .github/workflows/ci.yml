name: macOS checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Public source checks
        run: ./scripts/check-publication.py
      - name: Core catalog and search checks
        run: ./scripts/check-core.sh
      - name: Unit tests
        run: swift test
      - name: Build and verify app
        run: ./scripts/build-app.sh
      - name: Package release DMG
        run: ./scripts/build-dmg.sh --skip-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QuickKey-macOS
          path: |
            dist/QuickKey-*.dmg
            dist/QuickKey-*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
